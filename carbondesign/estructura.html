<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <!-- viewport-fit=cover: habilita los env(safe-area-inset-*) para que el pie
         de secciones libre el home indicator (iOS) / la barra de gestos
         (Android), y el marco pueda ir de borde a borde en PWA. -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <!-- theme-color: pinta el cromo del navegador (barra de URL de Android) del
         color de la barra superior del producto, como pide Carbon Native Mobile
         (status bar = color del header). Es el valor g100 `layer-01` del tema
         oscuro; va aquí (meta de navegador, no token de CSS). -->
    <meta name="theme-color" content="#262626" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>Ontikos · Dirección General · móvil</title>
    <!-- El favicon estaba en `public/` desde la sesión del kit de marca y
         este archivo NUNCA lo enlazaba, así que la pestaña del navegador
         salía con el icono genérico. Lo vio el dueño, no el medidor: no
         había comprobación que mirara el `<head>`. Ahora la hay.
         Es el símbolo del Kit de Marca v1.1, copiado y no redibujado. -->
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <script type="module" crossorigin src="./assets/estructura-C1FK-muP.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/estructura-BRCRAv-1.css">
  </head>
  <body>
    <div id="raiz"></div>
  </body>
</html>
