<!doctype html>

    <title>Ontikos · Dirección General (desarrollo)</title>
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <!-- Mismo punto de entrada, distingue el dispositivo: el teléfono recibe la
         app móvil (que debe ser el documento de nivel superior para que dvh y
         env(safe-area-inset-*) funcionen); el escritorio sigue con el tablero.
         Corre antes del bundle (el script de módulo va diferido). -->
    <script>
      (function () {
        try {
          var ua = navigator.userAgent || '';
          var phoneUA = /iPhone|iPod|Android.*Mobile|Windows Phone|BlackBerry|IEMobile|Opera Mini/i.test(ua);
          var mm = window.matchMedia;
          var narrow = mm && mm('(max-width: 768px)').matches;
          var coarse = mm && mm('(pointer: coarse)').matches;
          if (phoneUA || (narrow && coarse)) {
            window.location.replace('./movil/index.html');
          }
        } catch (e) {}
      })();
    </script>
